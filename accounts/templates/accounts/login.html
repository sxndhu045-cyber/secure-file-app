<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Secure File App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #07111f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: #0c1d2e;
            border: 1px solid #173c55;
            border-radius: 24px;
            padding: 45px;
            text-align: center;
            box-shadow: 0 0 40px rgba(53, 217, 255, 0.12);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #35d9ff;
            color: #07111f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        h1 {
            color: #35d9ff;
            margin-bottom: 10px;
        }

        .description {
            color: #b7c8d9;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #b7c8d9;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #173c55;
            background: #07111f;
            color: white;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #35d9ff;
            box-shadow: 0 0 12px rgba(53, 217, 255, 0.15);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: #35d9ff;
            color: #07111f;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(53, 217, 255, 0.22);
        }

        .error {
            background: #28151a;
            border: 1px solid #74313b;
            color: #ff9ca8;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
        }

        .security-note {
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            background: #07111f;
            color: #9eb3c5;
            font-size: 13px;
            line-height: 1.5;
        }

        .register {
            display: inline-block;
            margin-top: 22px;
            color: #35d9ff;
            text-decoration: none;
        }

        .register:hover {
            text-decoration: underline;
        }

        .home {
            display: block;
            margin-top: 15px;
            color: #7f9bad;
            text-decoration: none;
            font-size: 14px;
        }

        .home:hover {
            color: #35d9ff;
        }

        @media (max-width: 600px) {
            .card {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">
            🔐
        </div>

        <h1>Welcome Back</h1>

        <p class="description">
            Login to your Secure File App account
            and safely access your protected files.
        </p>

        {% if error %}
            <div class="error">
                ⚠️ {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">
                <label>User ID</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your User ID"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">
                🔓 Login Securely
            </button>

        </form>

        <div class="security-note">
            🛡️ Your account and protected files are secured
            with Secure File App.
        </div>

        <a class="register" href="{% url 'register' %}">
            Don't have an account? Create Account
        </a>

        <a class="home" href="/">
            ← Back to Home
        </a>

    </div>

</body>
</html>
